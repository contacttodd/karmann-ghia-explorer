<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0f1115">
  <title>Karmann Ghia Explorer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header>
      <div>
        <h1>1972 Karmann Ghia</h1>
        <div class="year">Explorer · Type 14</div>
      </div>
      <button id="notes-btn" style="background:#2a3140;color:#ccc;border:none;border-radius:8px;padding:6px 12px;font-size:0.8rem;">Notes</button>
    </header>

    <div id="viewer">
      <div id="selector-area" style="padding:16px;display:flex;flex-direction:column;gap:12px;max-width:420px;margin:auto;">
        <label style="font-size:0.85rem;color:#9aa3b2;">Area of the car</label>
        <select id="area-select" style="background:#1e2430;color:#e8eaed;border:1px solid #2a3140;border-radius:8px;padding:10px;font-size:1rem;">
          <option value="">Select area…</option>
          <option value="front">Front</option>
          <option value="rear">Rear / Engine</option>
          <option value="interior">Interior</option>
          <option value="brakes">Brakes (system)</option>
          <option value="electrical">Electrical (system)</option>
        </select>

        <label style="font-size:0.85rem;color:#9aa3b2;">Part / System</label>
        <select id="part-select" style="background:#1e2430;color:#e8eaed;border:1px solid #2a3140;border-radius:8px;padding:10px;font-size:1rem;" disabled>
          <option value="">Select part…</option>
        </select>
      </div>
      <div id="overlay-hint">Choose an area, then a part</div>
    </div>

    <nav id="nav"></nav>
  </div>

  <div id="panel">
    <div id="panel-header">
      <h2 id="panel-title">System</h2>
      <button id="panel-close">×</button>
    </div>
    <div id="panel-content"></div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
