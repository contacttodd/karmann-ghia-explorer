<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0f1115">
  <title>Karmann Ghia Explorer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header>
      <div>
        <h1>1972 Karmann Ghia</h1>
        <div class="year">Explorer · Type 14</div>
      </div>
      <button id="notes-btn" style="background:#2a3140;color:#ccc;border:none;border-radius:8px;padding:6px 12px;font-size:0.8rem;">Notes</button>
    </header>

    <div id="viewer">
      <img id="ghia-img" src="ghia.svg" alt="Karmann Ghia" style="width:100%;height:100%;object-fit:contain;display:block;">
      <div id="overlay-hint">Tap systems below to explore · Pinch/scroll to zoom image</div>
    </div>

    <nav id="nav"></nav>
  </div>

  <div id="panel">
    <div id="panel-header">
      <h2 id="panel-title">System</h2>
      <button id="panel-close">×</button>
    </div>
    <div id="panel-content"></div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
